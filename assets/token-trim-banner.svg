<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Dark Background Radial Gradient -->
    <radialGradient id="bg-glow" cx="80%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1f2430" />
      <stop offset="50%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Emerald Accent Gradient -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#58a6ff" />
    </linearGradient>

    <!-- Glassmorphism Card Gradient -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.7" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#21262d" stroke-width="0.8" stroke-opacity="0.5"/>
    </pattern>

    <!-- Shadow Effects -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="460" fill="url(#bg-glow)" />
  <rect width="1200" height="460" fill="url(#grid)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="5" fill="url(#primary-grad)" />

  <!-- LEFT COLUMN: Brand & Messaging -->
  <g transform="translate(70, 70)">
    <!-- Tech Category Tag -->
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#21262d" stroke="#30363d" />
    <text x="80" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#3fb950" text-anchor="middle" letter-spacing="1">PYTHON AST CLI</text>

    <!-- Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-1">
      ✂️ token-trim
    </text>

    <!-- Subtitle -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#8b949e">
      Prune Python docstrings &amp; comments to save
    </text>
    <text x="0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#f0f6fc">
      LLM context window tokens &amp; API costs.
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 190)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="135" height="36" rx="8" fill="#161b22" stroke="#30363d" />
      <text x="14" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#3fb950">⚡ AST Clean</text>

      <!-- Badge 2 -->
      <rect x="147" y="0" width="145" height="36" rx="8" fill="#161b22" stroke="#30363d" />
      <text x="161" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#58a6ff">📊 tiktoken Sync</text>

      <!-- Badge 3 -->
      <rect x="304" y="0" width="135" height="36" rx="8" fill="#161b22" stroke="#30363d" />
      <text x="318" y="22" font-family="sans-serif" font-size="13" font-weight="600" fill="#bc8cff">📋 Auto-Copy</text>
    </g>

    <!-- Metric Callout Box -->
    <g transform="translate(0, 250)">
      <rect x="0" y="0" width="439" height="56" rx="10" fill="url(#glass-grad)" stroke="#2ea043" stroke-width="1.2" stroke-opacity="0.4" />
      <text x="20" y="34" font-family="sans-serif" font-size="15" font-weight="700" fill="#3fb950">Save ~15-30% Tokens</text>
      <text x="195" y="34" font-family="sans-serif" font-size="14" font-weight="400" fill="#8b949e">without breaking program logic</text>
    </g>
  </g>

  <!-- RIGHT COLUMN: Interactive Terminal Card (Before vs After) -->
  <g transform="translate(610, 60)" filter="url(#drop-shadow)">
    <!-- Terminal Outer Frame -->
    <rect width="520" height="340" rx="12" fill="url(#glass-grad)" stroke="#30363d" stroke-width="1.5"/>

    <!-- Terminal Header Bar -->
    <path d="M 0 12 Q 0 0 12 0 L 508 0 Q 520 0 520 12 L 520 40 L 0 40 Z" fill="#161b22" />
    <circle cx="20" cy="20" r="6" fill="#ff5f56" />
    <circle cx="40" cy="20" r="6" fill="#ffbd2e" />
    <circle cx="60" cy="20" r="6" fill="#27c93f" />
    <text x="260" y="25" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#8b949e" text-anchor="middle">app.py — token-trim execution</text>

    <!-- Terminal Body Window -->
    <!-- BEFORE CARD -->
    <g transform="translate(20, 55)">
      <rect width="230" height="210" rx="8" fill="#0d1117" stroke="#30363d" />
      <rect x="0" y="0" width="230" height="28" rx="8" fill="#21262d" />
      <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#f85149">BEFORE (Raw Code)</text>
      <text x="180" y="18" font-family="sans-serif" font-size="11" fill="#8b949e">758 tok</text>

      <!-- Code Snippet Before -->
      <g transform="translate(12, 45)" font-family="'SFMono-Regular', Consolas, monospace" font-size="10" fill="#8b949e">
        <text x="0" y="0" fill="#ff7b72">def</text><text x="28" y="0" fill="#d2a8ff"> count_tokens</text><text x="110" y="0">(text):</text>
        <text x="10" y="18" fill="#8b949e">"""Counts tokens using</text>
        <text x="10" y="32" fill="#8b949e">tiktoken library accurately.</text>
        <text x="10" y="46" fill="#8b949e">Handles fallback models."""</text>
        <text x="10" y="66" fill="#79c0ff"># Parse model target</text>
        <text x="10" y="80" fill="#c9d1d9">enc = tiktoken.get()</text>
        <text x="10" y="98" fill="#79c0ff"># Return total length</text>
        <text x="10" y="112" fill="#ff7b72">return</text><text x="55" y="112" fill="#79c0ff"> len</text><text x="78" y="112">(enc.encode(text))</text>
      </g>
    </g>

    <!-- ARROW -->
    <g transform="translate(255, 150)">
      <text x="0" y="0" font-family="sans-serif" font-size="18" fill="#3fb950" text-anchor="middle">➔</text>
    </g>

    <!-- AFTER CARD -->
    <g transform="translate(270, 55)">
      <rect width="230" height="210" rx="8" fill="#0d1117" stroke="#2ea043" stroke-width="1.2" />
      <rect x="0" y="0" width="230" height="28" rx="8" fill="#1a2d20" />
      <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#3fb950">AFTER (Pruned)</text>
      <text x="180" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#3fb950">670 tok</text>

      <!-- Code Snippet After -->
      <g transform="translate(12, 45)" font-family="'SFMono-Regular', Consolas, monospace" font-size="10">
        <text x="0" y="0" fill="#ff7b72">def</text><text x="28" y="0" fill="#d2a8ff"> count_tokens</text><text x="110" y="0" fill="#c9d1d9">(text):</text>
        <text x="10" y="24" fill="#c9d1d9">enc = tiktoken.get()</text>
        <text x="10" y="44" fill="#ff7b72">return</text><text x="55" y="44" fill="#79c0ff"> len</text><text x="78" y="44" fill="#c9d1d9">(enc.encode(text))</text>
      </g>
    </g>

    <!-- Terminal Output Status Bar -->
    <rect x="20" y="280" width="480" height="40" rx="8" fill="#161b22" stroke="#30363d" />
    <text x="35" y="305" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#3fb950" font-weight="600">✓ Execution Complete:</text>
    <text x="200" y="305" font-family="'SFMono-Regular', Consolas, monospace" font-size="12" fill="#f0f6fc">Saved 88 tokens (11.6% reduction)</text>
  </g>
</svg>
